version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    commit-message:
      prefix: "Dependabot update\n\nCLA: trivial\n\n"
      include: "scope"
    labels:
      - "triaged: test"
      - "branch: master"
      - "cla: trivial"
      - "approval: review pending"
    reviewers:
      - "openssl/committers"
    cooldown:
      default-days: 7
