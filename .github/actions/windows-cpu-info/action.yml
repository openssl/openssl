name: get cpu info
description: Print Coreinfo output and the CPU features OpenSSL detects in _build

runs:
  using: composite
  steps:
  - name: download coreinfo
    shell: pwsh
    run: |
      mkdir _build\coreinfo
      Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Coreinfo.zip" -outfile "_build\coreinfo\Coreinfo.zip" -MaximumRetryCount 3 -RetryIntervalSec 30
  - name: get cpu info
    working-directory: _build
    shell: pwsh
    run: |
      7z.exe x coreinfo/Coreinfo.zip
      ./Coreinfo64.exe -accepteula -f
      ./apps/openssl.exe version -c
