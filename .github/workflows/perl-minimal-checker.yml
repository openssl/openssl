# Jobs run per pull request submission
name: Perl-minimal-checker CI
on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '*.md'
      - '*.pod'
      - 'README*'
      - 'funding.json'
      - 'LICENSE.txt'
      - 'VERSION.dat'
  push:
    paths-ignore:
      - 'doc/**'
      - '*.md'
      - '*.pod'
      - 'README*'
      - 'funding.json'
      - 'LICENSE.txt'
      - 'VERSION.dat'
permissions:
  contents: read

jobs:
  perl-minimal-checker:
    runs-on: ubuntu-latest
    steps:
    # We check with perl 5.26.1, the oldest perl 5.26.x shipped as the
    # system perl on maintained platforms (SLES 15, Ubuntu 18.04).
    - name: Install perl 5.26
      run: |
        pushd /tmp
        mkdir perl
        wget https://www.cpan.org/src/5.0/perl-5.26.1.tar.gz
        tar xf perl-5.26.1.tar.gz
        cd perl-5.26.1
        ./Configure -des -Dprefix=/tmp/perl -A ccflags='-Wno-incompatible-pointer-types' -A define:malloctype='void *' -A define:freetype='void'
        make -j$(nproc)
        make install
        echo "/tmp/perl/bin" >> "$GITHUB_PATH"
        popd
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Build openssl
      run: ./config && make -j $(nproc)
    - name: Install sed
      run: sudo apt update && sudo apt install sed
    - name: Check minimal version compliance
      run: |
        PM_FILES=($(find . -name "*.pm"))
        perl -v
        status=0
        for p in "${PM_FILES[@]}"; do perl -I"$(pwd)/util/perl" -I"$(pwd)" -I"$(pwd)/external/perl/Text-Template-1.56/lib" -c "$p" | sed -n '/@INC/{p; q1}' || status=1; done;
        exit $status
