# This sets the 'assisted: ai' label on PRs that have at least one
# commit with an Assisted-by: trailer, and removes it when no such
# commit remains (e.g. after a rebase).
#
# This uses pull_request_target because PRs from forks only get a
# read-only token with the plain pull_request event, making labeling
# impossible.  That is safe here: nothing from the PR is checked out
# or executed, only commit messages are read through the API.

name: Assisted-by Label

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: assisted-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-label:
    permissions:
      issues: write         # to create the label if missing
      pull-requests: write  # to add/remove the label on the PR
    runs-on: ubuntu-latest
    steps:
      - name: "Apply or remove the 'assisted: ai' label"
        uses: actions/github-script@v8
        with:
          script: |
            const LABEL = 'assisted: ai';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = context.payload.pull_request.number;

            // Ensure the label exists
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo,
                name: LABEL,
                color: 'e9d5ff',
                description: 'At least one commit carries an Assisted-by: trailer',
              });
            }

            // Scan all commit messages for an Assisted-by: trailer
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr_number, per_page: 100,
            });
            const assisted = commits.some(
              c => /^Assisted-by:/im.test(c.commit.message));

            const labeled = context.payload.pull_request.labels.some(
              l => l.name === LABEL);
            if (assisted && !labeled) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr_number, labels: [LABEL],
              });
            } else if (!assisted && labeled) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: pr_number, name: LABEL,
              });
            }
