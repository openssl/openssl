# Jobs run per pull request submission
name: Run-checker CI
on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '*.md'
      - '*.pod'
      - 'README*'
      - 'funding.json'
      - 'LICENSE.txt'
      - 'VERSION.dat'
  push:
    paths-ignore:
      - 'doc/**'
      - '*.md'
      - '*.pod'
      - 'README*'
      - 'funding.json'
      - 'LICENSE.txt'
      - 'VERSION.dat'
permissions:
  contents: read

env:
  OSSL_RUN_CI_TESTS: 1

jobs:
  run-checker:
    strategy:
      fail-fast: false
      matrix:
        opt: [
          no-cmp,
          no-cms,
          no-dgram,
          no-dh,
          no-dtls,
          no-ec,
          no-ecx,
          no-ml-dsa,
          no-ml-kem,
          no-http,
          no-legacy,
          no-sock,
          no-sm2,
          no-stdio,
          no-threads,
          no-thread-pool,
          no-default-thread-pool,
          no-tls,
          no-tls1_2,
          no-tls1_3,
          enable-trace enable-fips,
          enable-jitter-dynamic,
          no-quic,
          -DOPENSSL_USE_IPV6=0
        ]
    runs-on: ubuntu-latest
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/jitter
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: checkout jitter
      uses: actions/checkout@v6
      with:
        repository: smuellerDD/jitterentropy-library
        ref: v3.7.0
        path: jitter
        persist-credentials: false
    - name: build jitter
      run: |
        make -C jitter/
        cd jitter/
        so=$(ls libjitterentropy.so.*.*.*)
        ln -s $so libjitterentropy.so
        ln -s $so ${so%.*.*}
    - name: checkout fuzz/corpora submodule
      run: git submodule update --init --depth 1 fuzz/corpora
    - name: config
      run: CC=clang ./config --banner=Configured --strict-warnings ${{ matrix.opt }} --with-jitter-include=jitter/ --with-jitter-lib=jitter/
    - name: config dump
      run: ./configdata.pm --dump
    - name: make
      run: make -s -j4
    - name: check libjitterentropy linkage
      if: matrix.opt == 'enable-jitter-dynamic'
      run: |
        readelf -d libcrypto.so | grep -F '(NEEDED)' | grep -F libjitterentropy.so.
        ldd libcrypto.so | grep -F "libjitterentropy.so.3 => $LD_LIBRARY_PATH/libjitterentropy.so.3 "
        if readelf -d libssl.so apps/openssl | grep -F libjitterentropy; then
          exit 1
        fi
    - name: get cpu info
      run: |
        cat /proc/cpuinfo
        if [ -x apps/openssl ] ; then ./util/opensslwrap.sh version -c ; fi
    - name: Check platform symbol usage
      run: ./util/checkplatformsyms.pl ./util/platform_symbols/unix-symbols.txt ./libcrypto.so ./libssl.so
    - name: make test
      run: make test HARNESS_JOBS=${HARNESS_JOBS:-4}
