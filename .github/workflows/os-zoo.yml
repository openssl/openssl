name: OS Zoo CI

on:
  schedule:
    - cron: '50 02 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Internal: openssl-ci-bot PR number. Leave empty for a normal manual run.'
        required: false
        type: string
      head_sha:
        description: 'Internal: openssl-ci-bot commit SHA. Leave empty for a normal manual run.'
        required: false
        type: string
      check_run_id:
        description: 'Internal: openssl-ci-bot check-run ID. Leave empty for a normal manual run.'
        required: false
        type: string

# Keep in sync with openssl-ci-bot's run-name parser, and with the Actions statistics
# collector that attributes CI load by parsing this same string. Both break silently.
run-name: >-
  ${{ github.event.inputs.pr && format('ci-dispatch pr={0} head={1} check_run_id={2}', github.event.inputs.pr, github.event.inputs.head_sha, github.event.inputs.check_run_id) || github.workflow }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.pr || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Only a dispatch carries inputs, so this is skipped on the nightly cron.
  validate-dispatch-inputs:
    if: |
      github.repository == 'openssl/openssl' &&
      (inputs.pr != '' || inputs.head_sha != '' || inputs.check_run_id != '')
    uses: ./.github/workflows/validate-dispatch-inputs.yml
    with:
      pr: ${{ inputs.pr }}
      head_sha: ${{ inputs.head_sha }}
      check_run_id: ${{ inputs.check_run_id }}

  alpine:
    needs: [validate-dispatch-inputs]
    if: |
      github.repository == 'openssl/openssl' &&
      !cancelled() &&
      (needs.validate-dispatch-inputs.result == 'success' || needs.validate-dispatch-inputs.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        tag: [edge, latest]
        cc: [gcc, clang]
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/alpine:${{ matrix.tag }}
    env:
      # See https://www.openwall.com/lists/musl/2022/02/16/14
      # for the reason why -Wno-sign-compare is needed with clang
      # -Wno-stringop-overflow is needed to silence a bogus
      # warning on new fortify-headers with gcc
      EXTRA_CFLAGS: ${{ matrix.cc == 'clang' && '-Wno-sign-compare' || matrix.tag == 'edge' && '-Wno-stringop-overflow' || '' }}
      CC: ${{ matrix.cc }}
    steps:
    - name: install packages
      run: apk --no-cache add build-base perl linux-headers ${{ matrix.cc }}
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.head_sha || github.sha }}
    - name: config
      run: |
        ./config --strict-warnings --banner=Configured no-shared enable-fips \
                 ${EXTRA_CFLAGS}
    - name: config dump
      run: ./configdata.pm --dump
    - name: make
      run: make -s -j4
    - name: get cpu info
      run: |
        cat /proc/cpuinfo
        ./util/opensslwrap.sh version -c
    - name: make test
      run: make test HARNESS_JOBS=${HARNESS_JOBS:-4} LHASH_WORKERS=${LHASH_WORKERS:-16}

  linux:
    needs: [validate-dispatch-inputs]
    if: |
      github.repository == 'openssl/openssl' &&
      !cancelled() &&
      (needs.validate-dispatch-inputs.result == 'success' || needs.validate-dispatch-inputs.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        zoo:
          - image: docker.io/library/debian:11
            # Debian 11 LTS ended 2026-08-31: bullseye-security metadata is
            # expired and its pool has been pruned.  Use the snapshot repos
            # the image pins itself.
            install: |
              sed -i -e 's|^deb |#deb |' \
                    -e 's|^# deb http://snapshot|deb http://snapshot|' /etc/apt/sources.list && \
              apt-get -o Acquire::Check-Valid-Until=false update && \
              apt-get install -y gcc make perl
          - image: docker.io/library/debian:12
            install: apt-get update && apt-get install -y gcc make perl
          - image: docker.io/library/debian:trixie
            install: apt-get update && apt-get install -y gcc make perl
          - image: docker.io/library/ubuntu:20.04
            install: apt-get update && apt-get install -y gcc make perl
          - image: docker.io/library/ubuntu:22.04
            install: apt-get update && apt-get install -y gcc make perl
          - image: docker.io/library/ubuntu:24.04
            install: apt-get update && apt-get install -y gcc make perl
          - image: docker.io/library/fedora:41
            install: dnf install -y gcc make perl-core
          - image: docker.io/library/fedora:42
            install: dnf install -y gcc make perl-core
          - image: docker.io/library/centos:8
            install: |
              sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-* && \
              sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-* && \
              dnf install -y gcc make perl-core
          - image: docker.io/library/rockylinux:8
            install: dnf install -y gcc make perl-core
          - image: docker.io/library/rockylinux:9
            install: dnf install -y gcc make perl-core
    runs-on: ubuntu-latest
    container: ${{ matrix.zoo.image }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.head_sha || github.sha }}
    - name: install packages
      run: ${{ matrix.zoo.install }}
    - name: config
      run: ./config
    - name: config dump
      run: ./configdata.pm --dump
    - name: make
      run: make -j4
    - name: get cpu info
      run: |
        cat /proc/cpuinfo
        ./util/opensslwrap.sh version -c
    - name: make test
      run: make test HARNESS_JOBS=${HARNESS_JOBS:-4} LHASH_WORKERS=${LHASH_WORKERS:-16}

  macos:
    needs: [validate-dispatch-inputs]
    if: |
      github.repository == 'openssl/openssl' &&
      !cancelled() &&
      (needs.validate-dispatch-inputs.result == 'success' || needs.validate-dispatch-inputs.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.head_sha || github.sha }}
    - name: checkout fuzz/corpora submodule
      run: git submodule update --init --depth 1 fuzz/corpora
    - name: config
      run: ./config --strict-warnings --banner=Configured enable-fips enable-demos enable-h3demo
    - name: config dump
      run: ./configdata.pm --dump
    - name: make
      run: make -s -j4
    - name: get cpu info
      run: |
        sysctl machdep.cpu
        ./util/opensslwrap.sh version -c
    - name: make test
      run: make test HARNESS_JOBS=${HARNESS_JOBS:-4} LHASH_WORKERS=${LHASH_WORKERS:-16}

  windows:
    needs: [validate-dispatch-inputs]
    if: |
      github.repository == 'openssl/openssl' &&
      !cancelled() &&
      (needs.validate-dispatch-inputs.result == 'success' || needs.validate-dispatch-inputs.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-2022
            vcvars: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat
          - os: windows-2025
            vcvars: C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat
    runs-on: ${{ matrix.platform.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.head_sha || github.sha }}
    - name: checkout fuzz/corpora submodule
      run: git submodule update --init --depth 1 fuzz/corpora
    - name: install nasm
      run: |
        $installer = "nasm-3.01-installer-x64.exe"
        Invoke-WebRequest -Uri "https://openssl-library.org/ci-deps/$installer" -OutFile $installer
        $expected = (Get-Content "$env:GITHUB_WORKSPACE\.github\ci-deps.json" -Raw | ConvertFrom-Json).$installer
        $actual = (Get-FileHash $installer -Algorithm SHA256).Hash
        if ($actual -ne $expected) { throw "SHA256 mismatch for $installer (expected $expected, got $actual)" }
        Start-Process -FilePath ".\$installer" -ArgumentList '/S' -Wait
        "C:\Program Files\NASM" | Out-File -FilePath "$env:GITHUB_PATH" -Append
    - name: install jom
      run: |
        mkdir C:\jom
        Invoke-WebRequest -Uri "https://openssl-library.org/ci-deps/jom-1.1.7.exe" -OutFile C:\jom\jom.exe
        $expected = (Get-Content "$env:GITHUB_WORKSPACE\.github\ci-deps.json" -Raw | ConvertFrom-Json).'jom-1.1.7.exe'
        $actual = (Get-FileHash C:\jom\jom.exe -Algorithm SHA256).Hash
        if ($actual -ne $expected) { throw "SHA256 mismatch for jom.exe (expected $expected, got $actual)" }
        "C:\jom" | Out-File -FilePath "$env:GITHUB_PATH" -Append
    - name: prepare the build directory
      run: mkdir _build
    - name: config
      working-directory: _build
      shell: cmd
      run: |
        call "${{ matrix.platform.vcvars }}"
        perl ..\Configure --banner=Configured --strict-warnings no-makedepend enable-fips
        perl configdata.pm --dump
    - name: build
      working-directory: _build
      shell: cmd
      run: |
        call "${{ matrix.platform.vcvars }}"
        jom /j4 /S
    - name: download coreinfo
      run: |
        mkdir _build\coreinfo
        Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Coreinfo.zip" -outfile "_build\coreinfo\Coreinfo.zip"
    - name: get cpu info
      working-directory: _build
      run: |
        7z.exe x coreinfo/Coreinfo.zip
        ./Coreinfo64.exe -accepteula -f
        apps/openssl.exe version -c
    - name: test
      working-directory: _build
      shell: cmd
      run: |
        call "${{ matrix.platform.vcvars }}"
        jom test VERBOSE_FAILURE=yes HARNESS_JOBS=4 LHASH_WORKERS=16

  # GitHub-hosted, so pull-request code may build here: coverage bought, not risked. The
  # repository clause is new -- a cron in a fork expresses nobody's intent.
  linux-arm64:
    needs: [validate-dispatch-inputs]
    if: |
      github.repository == 'openssl/openssl' &&
      !cancelled() &&
      (needs.validate-dispatch-inputs.result == 'success' || needs.validate-dispatch-inputs.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.head_sha || github.sha }}
    - name: config
      run: ./config --strict-warnings enable-fips enable-ec_nistp_64_gcc_128 enable-md2 enable-rc5 enable-trace
    - name: config dump
      run: ./configdata.pm --dump
    - name: make
      run: make -j4
    - name: get cpu info
      run: ./util/opensslwrap.sh version -c
    - name: make test
      run: make test HARNESS_JOBS=${HARNESS_JOBS:-4} LHASH_WORKERS=${LHASH_WORKERS:-16}

  linux-x86:
    needs: [validate-dispatch-inputs]
    if: |
      github.repository == 'openssl/openssl' &&
      !cancelled() &&
      (needs.validate-dispatch-inputs.result == 'success' || needs.validate-dispatch-inputs.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.head_sha || github.sha }}
    - name: run container
      run: |
        CONTAINER_ID=$(podman run -d -v $(pwd):/mnt -w /mnt --platform=linux/i386 docker.io/i386/debian:13 sleep infinity)
        echo "CONTAINER_ID=$CONTAINER_ID" >> "$GITHUB_ENV"
    - name: install dependencies
      run:
        podman exec -t $CONTAINER_ID sh -c "apt-get update && apt-get install -y gcc perl make"
    - name: config
      run: |
        podman exec -t $CONTAINER_ID sh -c \
          "./config --strict-warnings linux-x86 enable-demos enable-fips enable-lms enable-md2 enable-rc5 enable-trace"
    - name: config dump
      run: |
        podman exec -t $CONTAINER_ID sh -c \
          "./configdata.pm --dump"
    - name: make
      run: |
        podman exec -t $CONTAINER_ID sh -c \
        "make -j"
    - name: get cpu info
      run: |
        cat /proc/cpuinfo
        podman exec -t $CONTAINER_ID sh -c \
          "./util/opensslwrap.sh version -c"
    - name: make test
      run: |
        podman exec -t $CONTAINER_ID sh -c \
          ".github/workflows/make-test"
    - name: save artifacts
      if: success() || failure()
      uses: actions/upload-artifact@v5
      with:
        name: "ci@linux-x86"
        path: artifacts.tar.gz

  linux-ppc64le:
    runs-on: linux-ppc64le
    needs: [validate-dispatch-inputs]
    if: |
      github.repository == 'openssl/openssl' &&
      ( github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.pr == '') ) &&
      !cancelled() &&
      (needs.validate-dispatch-inputs.result == 'success' || needs.validate-dispatch-inputs.result == 'skipped')
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.head_sha || github.sha }}
    - name: config
      run: ./config --strict-warnings enable-fips enable-ec_nistp_64_gcc_128 enable-md2 enable-rc5 enable-trace
    - name: config dump
      run: ./configdata.pm --dump
    - name: make
      run: make -j4
    - name: get cpu info
      run: |
        cat /proc/cpuinfo
        ./util/opensslwrap.sh version -c
    - name: make test
      run: make test HARNESS_JOBS=${HARNESS_JOBS:-4} LHASH_WORKERS=${LHASH_WORKERS:-16}

  linux-s390x:
    runs-on: linux-s390x
    needs: [validate-dispatch-inputs]
    if: |
      github.repository == 'openssl/openssl' &&
      ( github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.pr == '') ) &&
      !cancelled() &&
      (needs.validate-dispatch-inputs.result == 'success' || needs.validate-dispatch-inputs.result == 'skipped')
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.head_sha || github.sha }}
    - name: config
      run: ./config --strict-warnings enable-fips enable-md2 enable-rc5 enable-trace
    - name: config dump
      run: ./configdata.pm --dump
    - name: make
      run: make -j4
    - name: get cpu info
      run: |
        cat /proc/cpuinfo
        ./util/opensslwrap.sh version -c
    - name: make test
      run: make test HARNESS_JOBS=${HARNESS_JOBS:-4} LHASH_WORKERS=${LHASH_WORKERS:-16}

  linux-riscv64:
    runs-on: linux-riscv64
    needs: [validate-dispatch-inputs]
    if: |
      github.repository == 'openssl/openssl' &&
      ( github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.pr == '') ) &&
      !cancelled() &&
      (needs.validate-dispatch-inputs.result == 'success' || needs.validate-dispatch-inputs.result == 'skipped')
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.head_sha || github.sha }}
    - name: config
      run: ./config enable-fips enable-ec_nistp_64_gcc_128 enable-md2 enable-rc5 enable-trace
    - name: config dump
      run: ./configdata.pm --dump
    - name: make
      run: make -j8
    - name: get cpu info
      run: ./util/opensslwrap.sh version -c
    - name: make test
      env:
        OPENSSL_riscvcap: RV64GC_ZBA_ZBB_ZBC_ZBS_ZKT_V
      run: make test HARNESS_JOBS=${HARNESS_JOBS:-4} LHASH_WORKERS=${LHASH_WORKERS:-16}

  freebsd-x86_64:
    runs-on: ubuntu-latest
    needs: [validate-dispatch-inputs]
    if: |
      github.repository == 'openssl/openssl' &&
      !cancelled() &&
      (needs.validate-dispatch-inputs.result == 'success' || needs.validate-dispatch-inputs.result == 'skipped')
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.head_sha || github.sha }}
    - name: config
      uses: cross-platform-actions/action@46e8d7fb25520a8d6c64fd2b7a1192611da98eda #v0.30.0
      with:
        operating_system: freebsd
        version: "13.4"
        shutdown_vm: false
        run: |
          sudo pkg install -y gcc perl5
          ./config --strict-warnings enable-fips enable-ec_nistp_64_gcc_128 enable-md2 enable-rc5 enable-trace
    - name: config dump
      uses: cross-platform-actions/action@46e8d7fb25520a8d6c64fd2b7a1192611da98eda #v0.30.0
      with:
        operating_system: freebsd
        version: "13.4"
        shutdown_vm: false
        run: ./configdata.pm --dump
    - name: make
      uses: cross-platform-actions/action@46e8d7fb25520a8d6c64fd2b7a1192611da98eda #v0.30.0
      with:
        operating_system: freebsd
        version: "13.4"
        shutdown_vm: false
        run: make -j4
    - name: make test
      uses: cross-platform-actions/action@46e8d7fb25520a8d6c64fd2b7a1192611da98eda #v0.30.0
      with:
        operating_system: freebsd
        version: "13.4"
        run: |
          ./util/opensslwrap.sh version -c
          .github/workflows/make-test

  openbsd-x86_64:
    runs-on: ubuntu-latest
    needs: [validate-dispatch-inputs]
    if: |
      github.repository == 'openssl/openssl' &&
      !cancelled() &&
      (needs.validate-dispatch-inputs.result == 'success' || needs.validate-dispatch-inputs.result == 'skipped')
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.head_sha || github.sha }}
    - name: config
      uses: cross-platform-actions/action@46e8d7fb25520a8d6c64fd2b7a1192611da98eda #v0.30.0
      with:
        operating_system: openbsd
        architecture: x86-64
        version: '7.7'
        shutdown_vm: false
        run: |
          ./config --strict-warnings enable-fips enable-ec_nistp_64_gcc_128 enable-md2 enable-rc5 enable-trace
    - name: config dump
      uses: cross-platform-actions/action@46e8d7fb25520a8d6c64fd2b7a1192611da98eda #v0.30.0
      with:
        operating_system: openbsd
        architecture: x86-64
        version: '7.7'
        shutdown_vm: false
        run: |
          ./configdata.pm --dump
    - name: make
      uses: cross-platform-actions/action@46e8d7fb25520a8d6c64fd2b7a1192611da98eda #v0.30.0
      with:
        operating_system: openbsd
        architecture: x86-64
        version: '7.7'
        shutdown_vm: false
        run: |
          make -j4
    - name: make test
      uses: cross-platform-actions/action@46e8d7fb25520a8d6c64fd2b7a1192611da98eda #v0.30.0
      with:
        operating_system: openbsd
        architecture: x86-64
        version: '7.7'
        run: |
          ./util/opensslwrap.sh version -c
          .github/workflows/make-test
